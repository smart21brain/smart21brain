<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | Smart21Brain</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo/coool.png" type="image/png">
<link rel="apple-touch-icon" href="images/logo/coool.png">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=9">
<link rel="stylesheet" href="css/responsive.css?v=5">
<link rel="stylesheet" href="css/animations.css?v=4">
<style>
  .welcome-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  .welcome-card {
    width: 100%;
    max-width: 980px;
    background: var(--s21-white);
    border: 1px solid var(--s21-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--card-shadow-hover);
    padding: 2.25rem;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 2rem;
    align-items: stretch;
  }
  .welcome-videos {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  .welcome-video-box {
    position: relative;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: #000;
    aspect-ratio: 16 / 10;
    border: 1px solid var(--s21-border);
  }
  .welcome-video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .welcome-video-box .welcome-video-label {
    position: absolute;
    top: .7rem;
    left: .8rem;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: .3rem .65rem;
    border-radius: var(--radius-pill);
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .welcome-video-box .welcome-video-label i { font-size: .65rem; color: var(--s21-secondary); }
  .welcome-side {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1.5rem;
  }
  .welcome-side .s21-logo {
    font-size: 1.9rem;
    margin-bottom: 0;
  }
  .welcome-greeting {
    color: var(--s21-text-soft);
    font-size: .95rem;
    margin: -.75rem 0 0;
  }
  .welcome-actions {
    display: flex;
    flex-direction: column;
    gap: .9rem;
  }
  .welcome-actions .btn-s21 {
    width: 100%;
    justify-content: center;
    padding: 1rem 1.4rem;
    font-size: 1rem;
  }
  @media (max-width: 767px) {
    .welcome-card { grid-template-columns: 1fr; padding: 1.5rem; }
  }
</style>
</head>
<body class="p-0">
<main id="main">
  <div class="welcome-shell">
    <div class="welcome-card" data-aos="fade-up">

      <div class="welcome-videos">
        <div class="welcome-video-box">
          <span class="welcome-video-label"><i class="fa-solid fa-circle"></i> Playing</span>
          <video src="videos/splash-intro.mp4" autoplay muted loop playsinline preload="auto"></video>
        </div>
        <div class="welcome-video-box">
          <span class="welcome-video-label"><i class="fa-solid fa-circle"></i> Playing</span>
          <video src="videos/welcome-video-2.mp4" autoplay muted loop playsinline preload="auto"></video>
        </div>
        <a href="index.html" class="s21-logo">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2C8 2 6 4.5 6 7c0 1.2.4 2 1 2.7C6.4 10.6 6 11.7 6 13c0 3 2 5 2 5v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2s2-2 2-5c0-1.3-.4-2.4-1-3.3.6-.7 1-1.5 1-2.7 0-2.5-2-5-6-5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
          Smart<span class="brand-21">21</span>Brain
        </a>
        <p class="welcome-greeting" id="welcome-greeting">You're logged in. Where would you like to go?</p>
        <div class="welcome-actions">
          <a href="dashboard.html" id="welcome-go-dashboard" class="btn-s21 btn-s21-primary">
            <i class="fa-solid fa-gauge"></i> Go to Dashboard
          </a>
          <a href="index.html" class="btn-s21 btn-s21-outline">
            <i class="fa-solid fa-house"></i> Smart21Brain Home
          </a>
        </div>
      </div>

    </div>
  </div>
</main>

<script>
  // The login flow stashes where "Go to Dashboard" should point (it
  // depends on the account's role: admin/teacher/parent/user), plus a
  // display name for the greeting. Both are one-time — read and clear
  // immediately so a manual visit to this page later doesn't get stuck
  // reusing a stale target.
  (function () {
    try {
      var target = sessionStorage.getItem('s21-welcome-dashboard');
      var name = sessionStorage.getItem('s21-welcome-name');
      sessionStorage.removeItem('s21-welcome-dashboard');
      sessionStorage.removeItem('s21-welcome-name');
      if (target) {
        document.getElementById('welcome-go-dashboard').href = target;
      }
      if (name) {
        document.getElementById('welcome-greeting').textContent = 'Welcome back, ' + name + '! Where would you like to go?';
      }
    } catch (e) { /* sessionStorage unavailable — fall back to dashboard.html */ }
  })();
</script>
<script src="js/i18n.js"></script>
<script src="js/darkmode.js"></script>
</body>
</html>
