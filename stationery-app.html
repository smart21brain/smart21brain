<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stationery OS — smart21brain</title>
<meta name="description" content="Stationery OS: the all-in-one digital stationery operating system — POS, inventory, photo studio, PDF tools, online services, machine center, academy and ChopaAI.">
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo/coool.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="stationery-manifest.json">
<meta name="theme-color" content="#0f172a">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/stationery-app.css?v=1">
</head>
<body>
<!-- The app shell (sidebar/topbar/content) is built entirely by js/stationery/app.js
     into document.body — this keeps one consistent render path for every module. -->

<!-- ===== Tool libraries (Photo Studio / PDF & Image Tools), all client-side ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/6.0.1/tesseract.min.js"></script>

<!-- ===== Stationery OS app ===== -->
<script src="js/stationery/api.js"></script>
<script src="js/stationery/dashboard.js"></script>
<script src="js/stationery/pos.js"></script>
<script src="js/stationery/inventory.js"></script>
<script src="js/stationery/customers.js"></script>
<script src="js/stationery/finance.js"></script>
<script src="js/stationery/reports.js"></script>
<script src="js/stationery/photostudio.js"></script>
<script src="js/stationery/pdftools.js"></script>
<script src="js/stationery/onlineservices.js"></script>
<script src="js/stationery/machines.js"></script>
<script src="js/stationery/academy.js"></script>
<script src="js/stationery/chopaai.js"></script>
<script src="js/stationery/employees.js"></script>
<script src="js/stationery/settings.js"></script>
<script src="js/stationery/security.js"></script>
<script src="js/stationery/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('stationery-sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
